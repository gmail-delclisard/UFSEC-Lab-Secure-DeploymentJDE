name: Build and Deploy
on: 
  workflow_dispatch: 
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build image
        run: |
          docker build -t myapp:latest .
      - name: Push to ACR
        run: |
          az login --service-principal -u ${{ secrets.AZURE_USER }} -p ${{ secrets.AZURE_PASS }} --tenant ${{ secrets.AZURE_TENANT }}
          az acr login -n labdeployacrjcd
          docker tag myapp:latest labdeployacrjcd.azurecr.io/myapp:latest
          docker push labdeployacrjcd.azurecr.io/myapp:latest
      - name: Deploy to WebApp
        run: |
          az webapp config container set \
          -g RGLabDeploy-jcd \
          -n labdeploy-webapp-jcd \
          --container-image-name labdeployacrjcd.azurecr.io/myapp:latest \
          --container-registry-url https://labdeployacrjcd.azurecr.io \
          --container-registry-user <USERNAME> \
          --container-registry-password <PASSWORD>
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}
